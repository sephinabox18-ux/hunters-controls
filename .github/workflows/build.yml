name: Build melonDS Hunters APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get this repo (controls + patch)
        uses: actions/checkout@v4

      - name: Get melonDS Android source (pinned version)
        run: |
          git clone https://github.com/rafaelvcaetano/melonDS-android.git src
          cd src
          git checkout c42995caff0144f37ad9791dc9bc96d82e8a6f65
          git submodule update --init --recursive

      - name: Find the control files (wherever they were uploaded)
        run: |
          PATCH=$(find "$GITHUB_WORKSPACE" -name apply_mph.py -not -path "*/src/*" | head -1)
          if [ -z "$PATCH" ]; then echo "apply_mph.py is missing from the repo"; exit 1; fi
          MPH_DIR=$(dirname "$PATCH")
          echo "Using files in $MPH_DIR"
          ls -la "$MPH_DIR"
          for f in MphOverlayView.kt release.keystore; do
            [ -f "$MPH_DIR/$f" ] || { echo "$f must be in the same folder as apply_mph.py"; exit 1; }
          done
          echo "MPH_DIR=$MPH_DIR" >> "$GITHUB_ENV"

      - name: Apply Hunters controls
        working-directory: src
        run: python3 "$MPH_DIR/apply_mph.py" "$MPH_DIR"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: src
        run: |
          echo "MELONDS_KEYSTORE=$MPH_DIR/release.keystore" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=hunters123" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=hunters123" >> local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdRelease
          cp app/build/outputs/apk/gitHubProd/release/*.apk $GITHUB_WORKSPACE/melonDS-Hunters.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-Hunters
          path: melonDS-Hunters.apk

      - name: Publish APK (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Newest melonDS Hunters build. Install melonDS-Hunters.apk over the previous one.
          prerelease: false
          make_latest: true
          files: melonDS-Hunters.apk
